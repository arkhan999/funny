<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Funny Question</title>

<style>
    body {
        background: linear-gradient(to bottom right, #ffe8e8, #fff5f5);
        font-family: Arial, sans-serif;
        text-align: center;
        height: 100vh;
        margin: 0;
        overflow: hidden;
        color: #333;
    }

    h1 {
        margin-top: 80px;
        font-size: 35px;
        font-weight: bold;
        animation: fadeIn 1.5s;
    }

    @keyframes fadeIn {
        from {opacity: 0;}
        to {opacity: 1;}
    }

    .btn {
        padding: 15px 35px;
        font-size: 24px;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        margin: 20px;
        transition: 0.3s;
    }

    #yesBtn {
        background-color: #ff4d6d;
        color: white;
        box-shadow: 0 0 10px #ff4d6d;
    }

    #noBtn {
        background-color: #333;
        color: white;
    }

    /* Result text */
    #result {
        font-size: 40px;
        margin-top: 120px;
        display: none;
        animation: fadeIn 1.5s;
    }

    /* Police siren animation */
    #siren {
        width: 120px;
        margin: 20px auto;
        display: none;
        animation: sirenMove 1s infinite alternate;
    }

    @keyframes sirenMove {
        0% { transform: translateX(-20px); filter: drop-shadow(0 0 20px red); }
        100% { transform: translateX(20px); filter: drop-shadow(0 0 20px blue); }
    }

    /* Thief running animation */
    #thief {
        font-size: 50px;
        position: absolute;
        top: 70%;
        left: -100px;
        display: none;
        animation: runThief 3s linear forwards;
    }

    @keyframes runThief {
        0% { left: -100px; }
        100% { left: 110%; }
    }
</style>
</head>
<body>

<h1 id="question">😂 Did you stop stealing things?</h1>

<button id="yesBtn" class="btn">Yes</button>
<button id="noBtn" class="btn">No</button>

<div id="result"></div>

<!-- Police siren emoji animation -->
<div id="siren">🚨🚨🚨</div>

<!-- Thief running emoji -->
<div id="thief">🏃‍♂️💨</div>

<!-- Siren sound -->
<audio id="sirenSound">
    <source src="https://www.soundjay.com/misc/sounds/police-siren-1.mp3" type="audio/mpeg">
</audio>

<script>
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const question = document.getElementById("question");
    const result = document.getElementById("result");
    const siren = document.getElementById("siren");
    const thief = document.getElementById("thief");
    const sirenSound = document.getElementById("sirenSound");

    // YES → funny message
    yesBtn.addEventListener("click", () => {
        question.style.display = "none";
        yesBtn.style.display = "none";
        noBtn.style.display = "none";

        result.style.display = "block";
        result.innerHTML = "🤣 So you used to be a thief hahah!";
    });

    // NO → creepy police message + siren + thief running
    noBtn.addEventListener("click", () => {
        question.style.display = "none";
        yesBtn.style.display = "none";
        noBtn.style.display = "none";

        result.style.display = "block";
        result.innerHTML = "😈 Oh… so you ARE a thief? I’m calling the police 😈🚨";

        siren.style.display = "block";   // show siren animation
        thief.style.display = "block";   // show thief running animation
        sirenSound.play();               // play siren sound
    });
</script>

</body>
</html>
